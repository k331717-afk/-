name: Move Review Photos Into Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/review-photo-migration.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-review-database-writes
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REVIEW_NOTION_TOKEN: ${{ secrets.REVIEW_NOTION_TOKEN }}
      REVIEW_STATE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTION_REVIEW_DATABASE_ID: e7caefbd-53c1-428a-bf90-c8ef399d77d2
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r imweb_daily_report/requirements.txt cryptography
      - name: Validate review photo handling
        run: python imweb_daily_report/test_review_body.py
      - name: Prepare encrypted photo backup
        run: python imweb_daily_report/migrate_review_photos.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: review-photos-before-migration-encrypted
          path: review-photo-backup.enc
          retention-days: 90
          if-no-files-found: error
      - name: Move and verify review photos
        run: python imweb_daily_report/migrate_review_photos.py apply
      - name: Preserve review sync state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imweb-review-sync-state
          path: imweb_daily_report/review_sync_state.json
          retention-days: 90
          if-no-files-found: error
      - name: Clear old photo cells after verified preservation
        run: python imweb_daily_report/migrate_review_photos.py finalize
      - uses: actions/upload-artifact@v4
        with:
          name: review-photo-migration-result
          path: review-photo-migration-result.json
          if-no-files-found: error
