name: Keep Scheduled Workflows Active

on:
  schedule:
    # Monthly keepalive. 10:13 Asia/Seoul = 01:13 UTC.
    - cron: "13 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last_keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last_keepalive.txt
          git commit -m "chore: keep scheduled workflows active" || echo "No changes to commit"
          git push
