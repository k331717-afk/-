name: Move Review Content Into Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/review-body-migration.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-review-database-writes
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REVIEW_NOTION_TOKEN: ${{ secrets.REVIEW_NOTION_TOKEN }}
      REVIEW_STATE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTION_REVIEW_DATABASE_ID: e7caefbd-53c1-428a-bf90-c8ef399d77d2
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r imweb_daily_report/requirements.txt cryptography
      - name: Validate migration behavior
        run: python imweb_daily_report/test_review_body.py
      - name: Back up review properties and identity index
        run: python imweb_daily_report/migrate_review_body.py prepare
      - name: Preserve source backup before changing pages
        uses: actions/upload-artifact@v4
        with:
          name: review-properties-before-migration-encrypted
          path: review-migration-backup.enc
          retention-days: 90
          if-no-files-found: error
      - name: Move and verify all review bodies
        run: python imweb_daily_report/migrate_review_body.py apply
      - name: Preserve review sync identity and migration checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imweb-review-sync-state
          path: imweb_daily_report/review_sync_state.json
          retention-days: 90
          if-no-files-found: error
      - name: Delete legacy columns after verified content and index preservation
        run: python imweb_daily_report/migrate_review_body.py finalize
      - name: Save migration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-body-migration-result
          path: |
            review-migration-result.json
            review-migration-errors.json
          if-no-files-found: ignore
